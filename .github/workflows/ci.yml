name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nbaapi
          POSTGRES_USER: nbaapi
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nbaapi -d nbaapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nbaapi:test-only@localhost:5432/nbaapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify dependency locks
        run: |
          uv pip compile --python-platform linux --python-version 3.14 --output-file=requirements.txt --strip-extras requirements.in
          uv pip compile --python-platform linux --python-version 3.14 --output-file=requirements-dev.txt --strip-extras requirements-dev.in
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - run: ruff check app manage.py unicorn.py test migrations/versions
      - run: ruff format --check app manage.py unicorn.py test migrations/versions
      - run: python -m openapi_spec_validator app/swagger.yaml
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --tag awesome-nba-data-api:test .
