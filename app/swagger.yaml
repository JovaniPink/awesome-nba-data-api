swagger: "2.0"
info:
  description: OpenAPI contract for the NBA data service
  version: "1.0.0"
  title: NBA Data API
consumes:
  - application/json
produces:
  - application/json

basePath: /api

# Paths supported by the server application
paths:
  /people:
    get:
      operationId: app.api.people.read_all
      tags:
        - People
      summary: Read the entire set of people, sorted by last name
      description: Read a bounded page of people with stable last-name, first-name, and id ordering
      parameters:
        - name: limit
          in: query
          description: Maximum number of people to return
          required: false
          type: integer
          format: int32
          default: 50
          minimum: 1
          maximum: 100
        - name: offset
          in: query
          description: Number of ordered people to skip
          required: false
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        200:
          description: A stable, bounded page of people
          schema:
            type: array
            items:
              $ref: "#/definitions/Person"
        400:
          description: Invalid or unknown query parameter
          schema:
            $ref: "#/definitions/Problem"
  /people/{person_id}:
    get:
      operationId: app.api.people.read_one
      tags:
        - People
      summary: Read one person by id
      parameters:
        - name: person_id
          in: path
          description: Numeric person identifier
          required: true
          type: integer
          format: int64
          minimum: 1
      responses:
        200:
          description: The requested person
          schema:
            $ref: "#/definitions/Person"
        404:
          description: Person does not exist
          schema:
            $ref: "#/definitions/Problem"

definitions:
  Person:
    type: object
    properties:
      person_id:
        type: integer
        format: int64
        description: Person identifier
      fname:
        type: string
        description: First name
      lname:
        type: string
        description: Last name
      timestamp:
        type: string
        format: date-time
        description: Creation or update timestamp
  Problem:
    type: object
    required:
      - title
      - status
    properties:
      type:
        type: string
      title:
        type: string
      status:
        type: integer
      detail:
        type: string
