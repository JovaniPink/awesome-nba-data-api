openapi: 3.0.3
info:
  title: NBA Data API
  description: OpenAPI contract for the NBA data service
  version: 1.0.0

servers:
  - url: /api

paths:
  /people:
    get:
      operationId: app.api.people.read_all
      tags:
        - People
      summary: Read the entire set of people, sorted by last name
      description: Read a bounded page of people with stable last-name, first-name, and id ordering
      parameters:
        - name: limit
          in: query
          description: Maximum number of people to return
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of ordered people to skip
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: A stable, bounded page of people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "400":
          description: Invalid or unknown query parameter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /people/{person_id}:
    get:
      operationId: app.api.people.read_one
      tags:
        - People
      summary: Read one person by id
      parameters:
        - name: person_id
          in: path
          description: Numeric person identifier
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The requested person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Person does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    Person:
      type: object
      properties:
        person_id:
          type: integer
          format: int64
          description: Person identifier
        fname:
          type: string
          nullable: true
          description: First name
        lname:
          type: string
          nullable: true
          description: Last name
        timestamp:
          type: string
          format: date-time
          description: Creation or update timestamp
    Problem:
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
